<style>
*{box-sizing:border-box}
body{margin:0;font:400 14px/1.5 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f4f2ee;color:#222;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #ddd}
h1{font-size:18px;font-weight:700;margin:0}
header .sub{color:#666;font-size:12px;font-weight:500;margin-left:8px}
button{font:inherit;min-height:44px;min-width:44px;border:1px solid #bbb;border-radius:6px;background:#fff;color:#222;cursor:pointer;padding:4px 10px}
button:focus-visible{outline:3px solid #2a4a9a;outline-offset:2px}
main{flex:1;padding:12px}
#office{display:flex;justify-content:center;overflow:hidden;margin:0 auto;background:#2e2a26;border-radius:8px;max-width:1320px}
#ostage{position:relative;flex:none;transform-origin:top center;image-rendering:pixelated}
.o-floor{position:absolute;left:0;background-repeat:repeat}
.o-wall,.o-item{position:absolute;display:block;image-rendering:pixelated}
.o-wall{left:0;top:0}
.o-char{position:absolute;width:32px;height:32px;background-repeat:no-repeat;image-rendering:pixelated;--row:0px;background-position:0 var(--row);animation:o-frames 1s steps(4) infinite}
.o-char.walking{animation-duration:.5s}
.o-char.dir-left{--row:-32px}
.o-char.dir-right{--row:-64px}
.o-char.dir-up{--row:-96px}
.o-char.walking.dir-down{--row:-128px}
.o-char.walking.dir-left{--row:-160px}
.o-char.walking.dir-right{--row:-192px}
.o-char.walking.dir-up{--row:-224px}
@keyframes o-frames{to{background-position:-128px var(--row)}}
.o-blink{position:absolute;background-repeat:no-repeat;animation:o-blink 1.4s infinite}
@keyframes o-blink{to{background-position:var(--end) 0}}
.o-label{position:absolute;transform:translateX(-50%);background:rgba(40,40,44,.92);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;z-index:3000}
.o-bub{position:absolute;transform:translate(-50%,-100%);background:#fffdf6;color:#3a332c;border:2px solid #3a332c;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700;white-space:nowrap;z-index:4000}
.o-bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:#3a332c;border-bottom:0}
html.still *,html.still *::before,html.still *::after{animation-play-state:paused!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-play-state:paused!important;transition:none!important}}
footer{padding:8px 16px 16px;font-size:12px;font-weight:500;color:#555}
footer a{color:#2a4a9a}
</style>

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const motionBtn = document.getElementById('motion');
let userStill = false;
function motionOn() { return !userStill && !reduced.matches; }
function updateMotion() {
	document.documentElement.classList.toggle('still', !motionOn());
	motionBtn.textContent = motionOn() ? '움직임 끄기' : '움직임 켜기';
	motionBtn.setAttribute('aria-pressed', String(!motionOn()));
}
motionBtn.addEventListener('click', () => { userStill = !userStill; updateMotion(); });
if (reduced.addEventListener) reduced.addEventListener('change', updateMotion);

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ost = document.getElementById('ostage');
const oat = (e, x, y) => { e.style.left = x + 'px'; e.style.top = y + 'px'; return e; };

function oBubble(x, y, text, ms) {
	if (!motionOn()) return;
	const b = oat(el('div', 'o-bub', text), x, y);
	b.setAttribute('aria-hidden', 'true');
	ost.append(b);
	setTimeout(() => b.remove(), ms);
}

// 돌아다니는 사람: route 점을 CSS 이동(transition)으로 따라간다. 움직임 끄기면 제자리
function oWalk(it, e) {
	const route = it.char.route, SPEED = 40; // px/초
	let i = 0, x = route[0][0], y = route[0][1];
	const next = () => {
		const pause = route[i][2];
		if (pause) e.classList.remove('walking');
		setTimeout(() => {
			if (!motionOn()) { setTimeout(next, 2000); return; }
			i = (i + 1) % route.length;
			const tx = route[i][0], ty = route[i][1], dx = tx - x, dy = ty - y, dur = Math.hypot(dx, dy) / SPEED;
			e.className = 'o-char walking dir-' + (Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
			e.style.transition = 'left ' + dur + 's linear, top ' + dur + 's linear';
			e.style.zIndex = 1000 + Math.round(Math.max(y, ty));
			x = tx; y = ty; oat(e, x - it.anchor[0], y - it.anchor[1]);
			setTimeout(next, dur * 1000);
		}, pause * 1000);
	};
	next();
}

function drawOffice() {
	const L = OFFICE, CW = L.canvas[0], CH = L.canvas[1];
	ost.style.width = CW + 'px'; ost.style.height = CH + 'px';
	const fl = oat(el('div', 'o-floor'), 0, L.wall.band_px);
	fl.style.width = L.floor.w * L.tile + 'px'; fl.style.height = L.floor.h * L.tile + 'px';
	fl.style.backgroundImage = 'url(' + ARTMAP[L.floor.img] + ')';
	const wl = el('img', 'o-wall'); wl.src = ARTMAP[L.wall.img]; wl.alt = '';
	ost.append(fl, wl);
	const rank = (it) => it.kind === 'wall' ? -1 : it.kind === 'rug' ? 0 : 1;
	const zb = (it) => it.pos[1] + (it.zbias || 0);
	const seats = [];
	for (const it of L.items.slice().sort((a, b) => rank(a) - rank(b) || zb(a) - zb(b))) {
		let e;
		if (it.kind === 'char') {
			e = el('div', 'o-char dir-' + it.char.dir);
			e.style.backgroundImage = 'url(' + ARTMAP[it.img] + ')';
			e.style.animationDelay = -Math.random() + 's';
		} else if (it.frames) { // 가로 프레임 시트 (트리·가랜드 전구)
				e = el('div', 'o-blink');
			e.style.backgroundImage = 'url(' + ARTMAP[it.img] + ')';
			const nw = DIMS[it.img][0], nh = DIMS[it.img][1];
			e.style.width = nw / it.frames + 'px'; e.style.height = nh + 'px';
			e.style.setProperty('--end', -nw + 'px');
			e.style.animationTimingFunction = 'steps(' + it.frames + ')';
		} else {
			e = el('img', 'o-item'); e.src = ARTMAP[it.img]; e.alt = '';
			if (it.scale) { e.style.width = DIMS[it.img][0] * it.scale + 'px'; e.style.height = DIMS[it.img][1] * it.scale + 'px'; }
		}
		e.setAttribute('aria-hidden', 'true');
		const sc = it.scale || 1;
		oat(e, it.pos[0] - it.anchor[0] * sc, it.pos[1] - it.anchor[1] * sc);
		if (rank(it) === 1) e.style.zIndex = 1000 + Math.round(zb(it));
		ost.append(e);
		if (it.char && it.char.route) oWalk(it, e);
		else if (it.char && it.char.status) seats.push(it);
		if (it.label) {
			const dy = it.label_dy != null ? it.label_dy : (it.kind === 'char' ? -46 : -62);
			const lb = oat(el('div', 'o-label', it.label), it.pos[0], it.pos[1] + dy);
			lb.setAttribute('aria-hidden', 'true');
			ost.append(lb);
		}
	}
	// 상태 말풍선: 시안용 장식. 실제 HQ 처럼 한 자리씩 돌아가며 자리 상태 문구를 띄운다 (문구는 배치 파일의 예시 문구)
	let turn = 0;
	setInterval(() => {
		if (!seats.length) return;
		const it = seats[turn++ % seats.length];
		const st = it.char.status;
		oBubble(it.pos[0], it.pos[1] - 34, st[Math.floor(Math.random() * st.length)], 3500);
	}, 2500);
	const box = document.getElementById('office');
	let lastW = -1;
	const fit = () => { const w = box.clientWidth; if (w === lastW) return; lastW = w; const s = Math.min(2, w / CW); ost.style.transform = 'scale(' + s + ')'; box.style.height = CH * s + 'px'; };
	if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fit)).observe(box); else window.addEventListener('resize', fit);
	fit();
}
updateMotion();
drawOffice();
</script>
